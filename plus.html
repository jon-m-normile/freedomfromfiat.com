<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3F Tax Optimizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root {
      --primary: #5046e5;
      --primary-dark: #3d35b5;
      --accent: #00d4aa;
      --dark: #0f0f0f;
      --gray-700: #374151;
      --gray-500: #6b7280;
      --gray-300: #d1d5db;
      --gray-100: #f3f4f6;
      --white: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--gray-100);
      color: #1a1a1a;
      line-height: 1.6;
      min-height: 100vh;
    }
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--gray-100);
      z-index: 1000;
      padding: 1rem 2rem;
    }
    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--dark);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 0.875rem;
    }
    .page-container {
      max-width: 100%;
      margin: 0 auto;
      padding: 5.5rem 1rem 2rem;
    }
    .demo-frame-container {
      background: var(--white);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      position: relative;
    }
    .iframe-loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
      transition: opacity 0.4s ease;
    }
    .iframe-loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .iframe-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--gray-300);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .iframe-loading-overlay p {
      color: var(--gray-500);
      font-size: 0.9375rem;
    }
    .demo-frame-header {
      background: var(--dark);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .demo-frame-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .demo-frame-dot.red { background: #ff5f56; }
    .demo-frame-dot.yellow { background: #ffbd2e; }
    .demo-frame-dot.green { background: #27ca40; }
    .demo-frame-title {
      color: var(--gray-500);
      font-size: 0.875rem;
      margin-left: 1rem;
    }
    .demo-iframe {
      width: 100%;
      height: 900px;
      border: none;
    }
    @media (max-width: 640px) {
      .demo-iframe { height: 700px; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">3F</div>
        Freedom From Fiat
      </a>
    </div>
  </nav>

  <div class="page-container">
    <div class="demo-frame-container">
      <div class="demo-frame-header">
        <span class="demo-frame-dot red"></span>
        <span class="demo-frame-dot yellow"></span>
        <span class="demo-frame-dot green"></span>
        <span class="demo-frame-title">Tax Optimizer v2.5</span>
      </div>
      <div class="iframe-loading-overlay" id="iframeOverlay">
        <div class="iframe-spinner"></div>
        <p>Loading Tax Optimizer…</p>
      </div>
      <iframe
        class="demo-iframe"
        id="appIframe"
        src="https://crypto-tax-optimizer-plus.onrender.com"
        title="3F Tax Optimizer"
      ></iframe>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('iframeOverlay');
    const iframe = document.getElementById('appIframe');
    iframe.addEventListener('load', function() {
      setTimeout(() => overlay.classList.add('hidden'), 1500);
    });
  </script>
</body>
</html>
