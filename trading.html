<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f1a">
  <title>Trading Dashboard Login | Freedom From Fiat</title>
  <style>
    /* Ported from 3F-Payments-App/dashboard/static/css/style.css to keep this
       page visually identical to app.freedomfromfiat.com/login. */
    :root {
      --bg-primary: #0f0f1a;
      --bg-card: #1a1a2e;
      --bg-input: #16162a;
      --text-primary: #e8e8f0;
      --text-secondary: #8888a0;
      --text-muted: #555570;
      --accent-blue: #4a9eff;
      --accent-green: #2ecc71;
      --accent-red: #e74c3c;
      --border-color: #2a2a44;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.3);
      --top-bar-height: 52px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding-top: var(--top-bar-height);
      -webkit-font-smoothing: antialiased;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--top-bar-height);
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      background: var(--accent-blue);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      text-decoration: none;
    }

    .app-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .nav-back {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
    }

    .nav-back:hover { color: var(--text-primary); }

    .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: var(--accent-green);
      padding: 2px 6px;
    }

    .secure-badge svg {
      width: 12px;
      height: 12px;
    }

    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--top-bar-height));
      padding: 16px;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 40px 32px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .login-logo {
      font-size: 20px;
      padding: 8px 16px;
      margin-bottom: 12px;
      display: inline-block;
    }

    .login-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 16px 0 4px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .login-label {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: left;
    }

    .pin-input {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 600;
      text-align: left;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    .pin-input:focus { border-color: var(--accent-blue); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      font-family: inherit;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-success {
      background: var(--accent-green);
      color: #fff;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-top: 4px;
    }

    .login-signup-text {
      margin-top: 20px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .login-signup-text a {
      color: var(--accent-blue);
      text-decoration: none;
      font-weight: 500;
    }

    .login-signup-text a:hover { text-decoration: underline; }

    .status {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: 16px;
      min-height: 1em;
    }

    .status.ready { color: var(--accent-green); }
  </style>
</head>
<body>

  <header class="top-bar">
    <div class="top-bar-left">
      <a href="/" class="logo">3F</a>
      <span class="app-title">Freedom From Fiat</span>
    </div>
    <div class="top-bar-right" style="display:flex;align-items:center;gap:12px;">
      <a href="/" class="nav-back">← Back to site</a>
      <span class="secure-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        HTTPS
      </span>
    </div>
  </header>

  <div class="login-container">
    <div class="login-card">
      <span class="logo login-logo">3F</span>
      <h1 class="login-title">Trading Dashboard Login</h1>
      <p class="subtitle">Sign in to your 3F account</p>

      <form method="POST" action="https://app.freedomfromfiat.com/login" class="login-form">
        <label for="username" class="login-label">Username</label>
        <input type="text" id="username" name="username"
               autocomplete="username" class="pin-input" autofocus required>

        <label for="password" class="login-label">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" class="pin-input" required>

        <button type="submit" class="btn btn-success login-btn">Sign in</button>
      </form>

      <p class="status" id="status">Connecting to dashboard...</p>

      <p class="login-signup-text">
        Don't have an account? <a href="/waitlist">Join the waitlist</a> ·
        <a href="https://app.freedomfromfiat.com/signup" id="open-account-link">Open an account</a>
      </p>
    </div>
  </div>

  <script>
    const statusEl  = document.getElementById('status');
    const form      = document.querySelector('form');
    const btn       = document.querySelector('button[type="submit"]');
    const healthUrl = 'https://app.freedomfromfiat.com/health';
    const start     = Date.now();
    let renderReady = false;

    // Poll /health every 2 s until the Flask app returns a real 200.
    // Render's cold-start infrastructure returns an immediate non-200 response
    // while spinning up, so we can't trust a single ping.
    const pingPromise = (async function poll() {
      while (true) {
        try {
          const r = await fetch(`${healthUrl}?_=${Date.now()}`);
          if (r.ok) {
            renderReady = true;
            const elapsed = ((Date.now() - start) / 1000).toFixed(1);
            statusEl.textContent = `Dashboard ready (${elapsed}s)`;
            statusEl.classList.add('ready');
            return;
          }
        } catch (_) {}
        await new Promise(resolve => setTimeout(resolve, 2000));
      }
    })();

    // Shared hold-and-wait: disables further interaction, shows the waking-up
    // message, then runs `then` once Render responds. Used by both the login
    // form submit and the Open Account link below.
    function whenReady(readyMessage, then) {
      statusEl.textContent = 'Server is waking up, please wait…';
      statusEl.classList.remove('ready');

      pingPromise.then(() => {
        statusEl.textContent = readyMessage;
        statusEl.classList.add('ready');
        then();
      });
    }

    // Intercept submit: if Render isn't up yet, hold the form here on the
    // static page with a clear message rather than navigating to a blank tab.
    form.addEventListener('submit', function (e) {
      if (renderReady) return; // already up — let browser submit normally

      e.preventDefault();
      btn.disabled = true;
      whenReady('Ready — signing in…', () => form.submit());
    });

    // Same gating for the Open Account link — it also targets the sleeping
    // Render app, so don't navigate until /health confirms it's awake.
    const openAccountLink = document.getElementById('open-account-link');
    openAccountLink.addEventListener('click', function (e) {
      if (renderReady) return; // already up — let the link navigate normally

      e.preventDefault();
      openAccountLink.style.pointerEvents = 'none';
      whenReady('Ready — redirecting…', () => {
        window.location.href = openAccountLink.href;
      });
    });
  </script>

</body>
</html>
