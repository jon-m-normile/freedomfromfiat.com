<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Dashboard Login | Freedom From Fiat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #5046e5;
      --primary-dark: #3d35b5;
      --accent: #00d4aa;
      --dark: #0f0f0f;
      --gray-900: #1a1a1a;
      --gray-700: #374151;
      --gray-500: #6b7280;
      --gray-300: #d1d5db;
      --gray-100: #f3f4f6;
      --white: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--gray-100);
      color: var(--gray-900);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    nav {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--gray-100);
      padding: 1rem 2rem;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }

    .nav-back {
      font-size: 0.875rem;
      color: var(--gray-500);
      text-decoration: none;
    }

    .nav-back:hover { color: var(--primary); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: var(--white);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }

    .card-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .card-icon {
      width: 48px;
      height: 48px;
      background: var(--primary);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .card-icon svg {
      width: 24px;
      height: 24px;
      stroke: white;
      fill: none;
      stroke-width: 2;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--gray-900);
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--gray-500);
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gray-700);
      margin-bottom: 0.375rem;
    }

    input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1.5px solid var(--gray-300);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--gray-900);
      background: var(--white);
      margin-bottom: 1rem;
      transition: border-color 0.15s;
      outline: none;
    }

    input:focus { border-color: var(--primary); }

    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 0.5rem;
    }

    button[type="submit"]:hover { background: var(--primary-dark); }

    .footer-text {
      text-align: center;
      font-size: 0.8125rem;
      color: var(--gray-500);
      margin-top: 1.5rem;
    }

    .footer-text a {
      color: var(--primary);
      text-decoration: none;
    }

    .footer-text a:hover { text-decoration: underline; }

    .status {
      font-size: 0.75rem;
      color: var(--gray-500);
      text-align: center;
      margin-top: 0.75rem;
      min-height: 1rem;
    }

    .status.ready { color: var(--accent); }
  </style>
</head>
<body>

  <nav>
    <div class="nav-container">
      <a href="/" class="logo">3F</a>
      <a href="/" class="nav-back">← Back to site</a>
    </div>
  </nav>

  <main>
    <div class="card">
      <div class="card-header">
        <div class="card-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <h1>Trading Dashboard</h1>
        <p class="subtitle">Sign in to your 3F account</p>
      </div>

      <form method="POST" action="https://app.freedomfromfiat.com/login">
        <label for="username">Username</label>
        <input type="text" id="username" name="username"
               autocomplete="username" autofocus required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               autocomplete="current-password" required>

        <button type="submit">Sign in</button>
      </form>

      <p class="status" id="status">Connecting to dashboard...</p>

      <p class="footer-text">
        Don't have an account? <a href="/waitlist">Join the waitlist</a>
      </p>
    </div>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const form     = document.querySelector('form');
    const btn      = document.querySelector('button[type="submit"]');
    const appUrl   = 'https://app.freedomfromfiat.com/login';
    const start    = Date.now();
    let renderReady = false;

    // Ping Render immediately so it starts waking up while the user types.
    // The fetch() resolves only once Render actually responds, so we can
    // use it as a reliable "server is up" signal.
    const pingPromise = fetch(appUrl, { method: 'GET', mode: 'no-cors', cache: 'no-store' })
      .then(() => {
        renderReady = true;
        const elapsed = ((Date.now() - start) / 1000).toFixed(1);
        statusEl.textContent = `Dashboard ready (${elapsed}s)`;
        statusEl.classList.add('ready');
      })
      .catch(() => {
        // Network error — let the form submit anyway and show the browser error
        renderReady = true;
        statusEl.textContent = '';
      });

    // Intercept submit: if Render isn't up yet, hold the form here on the
    // static page (with a clear message) rather than navigating to a blank tab.
    form.addEventListener('submit', function (e) {
      if (renderReady) return; // already up — let the browser submit normally

      e.preventDefault();
      btn.disabled = true;
      statusEl.textContent = 'Server is waking up, please wait…';
      statusEl.classList.remove('ready');

      pingPromise.then(() => {
        statusEl.textContent = 'Ready — signing in…';
        statusEl.classList.add('ready');
        form.submit();
      });
    });
  </script>

</body>
</html>
